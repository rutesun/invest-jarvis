name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff check
        run: uv run --group dev ruff check src tests --output-format=github

      - name: Run ruff format check
        run: uv run --group dev ruff format --check src tests

      - name: Detect unused code
        run: uv run --group dev vulture src --min-confidence 80
        continue-on-error: true

      - name: Type check (if mypy available)
        run: |
          if uv run --group dev mypy --version 2>/dev/null; then
            uv run --group dev mypy src --ignore-missing-imports
          else
            echo "mypy not installed, skipping type check"
          fi
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: uv run pytest tests/ -v --ignore=tests/integration --cov=src --cov-report=term-missing
