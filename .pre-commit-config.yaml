# Pre-commit hooks for code quality
# Install: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

repos:
  # Prevent commits to main branch
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: no-commit-to-branch
        name: prevent commits to main
        args: ['--branch', 'main']

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --group dev ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --group dev ruff format
        language: system
        types: [python]
        require_serial: true

      - id: check-features-doc
        name: check FEATURES.md updated
        entry: bash -c 'git diff --cached --name-only | grep -q "^src/" && ! git diff --cached --name-only | grep -q "^docs/FEATURES.md" && echo "⚠️  src/ 변경이 있지만 docs/FEATURES.md가 업데이트되지 않았습니다. 기능 변경이면 FEATURES.md도 업데이트하세요." || true'
        verbose: true
        language: system
        pass_filenames: false
        always_run: true

      - id: check-features-doc-llm
        name: LLM feature change detection
        entry: bash scripts/check-features-doc.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: vulture
        name: detect unused code
        entry: uv run --group dev vulture src --min-confidence 80
        language: system
        pass_filenames: false
        # Allow failure for now (informational)
        verbose: true
        stages: [manual]

      - id: pytest-fast
        name: fast unit tests
        entry: uv run pytest tests/ --ignore=tests/integration -x --tb=short
        language: system
        pass_filenames: false
        stages: [manual]
