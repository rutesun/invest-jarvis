technical:
  strategies:
    - trend
    - oscillator
    - divergence
    - disparity
    - risk

cache:
  quote_ttl: 60        # 1분
  history_ttl: 300     # 5분
  indicators_ttl: 300  # 5분

telegram:
  channels:
    - id: "ked_epic_ai"
      timezone: "Asia/Seoul"
    - id: "kiwoom_semibat"
      timezone: "Asia/Seoul"
    - id: "kwusa"
      timezone: "Asia/Seoul"
    - id: "jeilstock"
      timezone: "Asia/Seoul"
    - id: "growthresearch"
      timezone: "Asia/Seoul"
    - id: "hana_us_stock"
      timezone: "Asia/Seoul"
    - id: "HANAStrategy"
      timezone: "Asia/Seoul"
    - id: "HanaResearch"
      timezone: "Asia/Seoul"
    - id: "shinhanresearch"
      timezone: "Asia/Seoul"
    - id: "NeulBom"
      timezone: "Asia/Seoul"
    - id: "Brain_And_Body_Research"
      timezone: "Asia/Seoul"
    - id: "shsmallcap"
      timezone: "Asia/Seoul"
  output_dir: "data"

stock_report:
  normalize:
    short_comment_max_chars: 100
    group_window_minutes: 30
    short_comment_channels:
      - "hana_us_stock"
      - "kwusa"
      - "kiwoom_semibat"

llm:
  defaults:
    provider: openai
    model: gpt-5.6-terra
    temperature: 0.0
  daily:                 # jarvis report daily
    map:     { model: gpt-5.6-luna, temperature: 0.2 }
    shuffle: { model: gpt-5.6-luna, temperature: 0.1 }
    reduce:  { temperature: 0.3 }
    wrapup:  { temperature: 0.4 }
  daily_v2:              # jarvis report daily-v2
    extraction: { model: gpt-5.6-luna, temperature: 0.1 }
    synthesis:  { model: gpt-5.6-sol,  temperature: 0.1 }
  analyze: {}            # jarvis analyze → defaults(terra)
  brief:   {}            # jarvis brief → defaults(terra)
