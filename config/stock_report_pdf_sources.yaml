# PDF 브로커 소스 매핑: 파일명 prefix -> 정식 브로커명 / trust_tier
#
# 매칭 규칙: 파일명이 어떤 key로 시작하는지(startswith)를 검사하고, 일치하는 key 중
# 가장 긴 것을 채택한다. (예: "hana_us_stock_url_9339.pdf" -> key "hana_us_stock")
# 일치하는 key가 없으면 첫 토큰(첫 '_' 앞)을 broker_key/broker_name으로 그대로 사용한다.
#
# trust_tier: high(증권사 정식 리서치) | unknown(미확인 — 정식 브로커명 확인 필요)
# 확신이 없는 prefix는 name을 prefix 문자열과 동일하게 두어(identity) 잘못된 이름을
# 만들지 않는다. trust_tier=unknown 항목은 사용자가 정식 명칭으로 채운다.

sources:
  shinhanresearch:
    name: 신한투자증권
    trust_tier: high
  shsmallcap:
    name: 신한투자증권
    trust_tier: high
  HanaResearch:
    name: 하나증권
    trust_tier: high
  hana_us_stock:
    name: 하나증권
    trust_tier: high
  HANAStrategy:
    name: 하나증권
    trust_tier: high
  kiwoom_semibat:
    name: 키움증권
    trust_tier: high
  kwusa:
    name: kwusa
    trust_tier: unknown
  jeilstock:
    name: jeilstock
    trust_tier: unknown
  Brain_And_Body_Research:
    name: Brain_And_Body_Research
    trust_tier: unknown
  NeulBom:
    name: NeulBom
    trust_tier: unknown
