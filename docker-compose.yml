services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: stock_report
      POSTGRES_USER: report
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - stock_report_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  stock_report_pgdata:
