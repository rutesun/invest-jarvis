[project]
name = "invest-jarvis"
version = "0.3.0"
description = "Financial investment analysis CLI tool"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "pandas-ta>=0.3.14b",
    "yfinance>=0.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "langchain-openai>=1.1.12",
    "langchain-anthropic>=1.4.0",
    "langchain-aws>=1.4.4",
    "langchain-core>=1.2.28",
    "scipy>=1.17.1",
    "ddgs>=9.0.0",
    "telethon>=1.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "opik>=1.11.0",
]

[project.scripts]
jarvis = "src.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
