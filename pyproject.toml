[project]
name = "invest-jarvis"
version = "0.3.0"
description = "Financial investment analysis CLI tool"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "pandas-ta>=0.3.14b",
    "yfinance>=0.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "langchain-openai>=1.1.12",
    "langchain-anthropic>=1.4.0",
    "langchain-aws>=1.4.4",
    "langchain-core>=1.2.28",
    "scipy>=1.17.1",
    "ddgs>=9.0.0",
    "telethon>=1.36.0",
    "notion-client>=2.0.0",
    "fear-and-greed>=0.4",
    "mplfinance>=0.12.10b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "opik>=1.11.0",
]

[project.scripts]
jarvis = "src.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests requiring external APIs (KIS, OpenAI, Telegram, Naver)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import order)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]
[tool.ruff.lint.per-file-ignores]
"src/pipelines/daily_report/stages/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
lines-after-imports = 2

[tool.vulture]
min_confidence = 80
paths = ["src"]
exclude = ["tests/", "scripts/"]
ignore_decorators = ["@app.command", "@pytest.fixture", "@traceable"]
ignore_names = ["test_*", "setUp", "tearDown"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.11",
    "vulture>=2.16",
]
